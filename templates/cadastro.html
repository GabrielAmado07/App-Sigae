<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pacientes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body>
    <header class="topbar">
        <div class="topbar-brand">Sistema Hospitalar — Triagem</div>
        <div class="topbar-actions">
            <span>Recepção / Triagem</span>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-circle">+</div>
            </div>
            <ul class="nav-list">
                <li class="nav-item"><a href="{{ url_for('index') }}">Fila de atendimento</a></li>
                <li class="nav-item active"><a href="{{ url_for('cadastro') }}">Cadastrar paciente</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Cadastro de pacientes</h1>
                    <p class="page-subtitle">Preencha os dados para adicionar um paciente à fila.</p>
                </div>
            </div>

            <div class="triage-grid registration-grid">
                <section class="panel" id="cadastro">
                    <div class="panel-header">Cadastro na Triagem</div>
                    <div class="panel-body">
                        <form method="POST" action="{{ url_for('cadastro') }}" class="triage-form">
                            <div class="form-group">
                                <label for="nome">Nome:</label>
                                <input type="text" id="nome" name="nome" placeholder="Nome completo do paciente" required>
                            </div>

                            <div class="form-group">
                                <label for="horario">Horário de chegada:</label>
                                <input type="time" id="horario" name="horario" required>
                            </div>

                            <div class="form-group">
                                <label for="classificacao">Classificação:</label>
                                <select id="classificacao" name="classificacao" required>
                                    <option value="EMERGENCIA">Emergência</option>
                                    <option value="MUITO_URGENTE">Muito Urgente</option>
                                    <option value="URGENTE">Urgente</option>
                                    <option value="POUCO_URGENTE">Pouco Urgente</option>
                                    <option value="NAO_URGENTE">Não Urgente</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary">Adicionar à Fila</button>
                        </form>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>

</html>
